name: Daily Data Collect

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Trade date, for example 2026-06-02. Leave blank to use today."
        required: false
        default: ""
  schedule:
    - cron: "30 7 * * 1-5"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve trade date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.trade_date }}" ]; then
            echo "trade_date=${{ inputs.trade_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "trade_date=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect data
        run: |
          PYTHONPATH=tools python tools/collect_daily_data.py "${{ steps.date.outputs.trade_date }}" --out-dir . --allow-insecure

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-share-review-${{ steps.date.outputs.trade_date }}
          path: |
            data/raw/${{ steps.date.outputs.trade_date }}
            data/processed/${{ steps.date.outputs.trade_date }}
            data/reports/${{ steps.date.outputs.trade_date }}
          if-no-files-found: warn
